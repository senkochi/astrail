<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrail - Enter the Starry Sky</title>
    <link rel="icon" type="image/png" th:href="@{/assets/logo.png}">
    <!-- Google Fonts: Cinzel for brand logo/serif text, Inter for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #0F172A;
            /* Deep Midnight Blue */
            --secondary: #1E293B;
            --accent: #D4AF37;
            /* Warm Gold */
            --background: #0F172A;
            --success: #4ADE80;
            --error: #EF4444;
            --glass-bg: rgba(15, 23, 42, 0.45);
            --glass-border: rgba(214, 175, 55, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Celestial space background effects */
        .cosmic-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula-glow-1 {
            position: absolute;
            top: 25%;
            left: 20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.04) 0%, rgba(15, 23, 42, 0) 70%);
            filter: blur(80px);
        }

        .nebula-glow-2 {
            position: absolute;
            bottom: 15%;
            right: 15%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, rgba(15, 23, 42, 0) 70%);
            filter: blur(100px);
        }

        /* Container for the centered login flow */
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        /* Brand Logo Area */
        .brand-logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 35px;
            user-select: none;
        }

        .logo-emblem {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.35));
            animation: floatLogo 6s infinite ease-in-out;
        }

        .logo-text {
            font-family: 'Cinzel', serif;
            font-size: 32px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: 8px;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            margin-right: -8px;
            /* Offset the letter-spacing on the last char */
        }

        /* Floating Glassmorphism Login Card */
        .glass-card {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(140%);
            -webkit-backdrop-filter: blur(25px) saturate(140%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px 35px 35px 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4),
                inset 0 1px 0px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* Wave curve ornaments inside the card borders */
        .card-wave-tr {
            position: absolute;
            top: 0;
            right: 0;
            width: 130px;
            height: 130px;
            pointer-events: none;
            opacity: 0.65;
        }

        .card-wave-bl {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 130px;
            height: 130px;
            pointer-events: none;
            opacity: 0.65;
        }

        /* Welcome Message */
        .welcome-title {
            font-size: 19px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 28px;
            letter-spacing: 0.5px;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }

        /* Form Controls */
        .form-group {
            position: relative;
            margin-bottom: 20px;
            width: 100%;
        }

        .input-field {
            width: 100%;
            padding: 15px 22px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
            /* Rounded pill inputs */
            color: #FFFFFF;
            font-size: 15px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        /* Awakening focus glow effect */
        .input-field:focus {
            border-color: var(--accent);
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        /* Checkbox Area */
        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 26px;
            padding: 0 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }

        .remember-checkbox {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .remember-checkbox input {
            display: none;
        }

        .custom-checkbox {
            width: 16px;
            height: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: rgba(15, 23, 42, 0.5);
        }

        .remember-checkbox input:checked+.custom-checkbox {
            border-color: var(--accent);
            background: var(--accent);
        }

        .remember-checkbox input:checked+.custom-checkbox::after {
            content: '';
            width: 4px;
            height: 8px;
            border: solid #0F172A;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg) translate(-1px, -1px);
        }

        /* Primary Button CTA */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #F5D061 0%, #D4AF37 50%, #B38F24 100%);
            border: none;
            border-radius: 9999px;
            /* Rounded pill button */
            color: var(--primary);
            /* Deep Midnight Blue */
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
            text-align: center;
            display: block;
        }

        .btn-submit:hover {
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.5);
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* UI Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: rgba(255, 255, 255, 0.25);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 24px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider:not(:empty)::before {
            margin-right: 1.5em;
        }

        .divider:not(:empty)::after {
            margin-left: 1.5em;
        }

        /* Google login button styled for glassmorphism */
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 13px;
            border-radius: 9999px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            width: 100%;
        }

        .btn-google:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            color: #FFFFFF;
        }

        .btn-google svg {
            width: 18px;
            height: 18px;
        }

        /* Footer Links inside Card */
        .card-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 30px;
            font-size: 13px;
        }

        .card-footer-link {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: color 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .card-footer-link:hover {
            color: var(--accent);
        }

        .footer-separator {
            width: 1px;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.15);
        }

        /* Security Alerts styling */
        .alert {
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 22px;
            font-family: 'Inter', sans-serif;
            line-height: 1.4;
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: rgba(239, 68, 68, 0.9);
        }

        .alert-success {
            background-color: rgba(74, 222, 128, 0.1);
            border: 1px solid var(--success);
            color: rgba(74, 222, 128, 0.9);
        }

        /* Floating Stars & Constellation Graphics */
        .celestial-star {
            position: absolute;
            fill: #FFFFFF;
            opacity: 0.15;
            animation: twinkle 4s infinite ease-in-out;
        }

        .fox-constellation {
            position: absolute;
            right: 8%;
            top: 20%;
            width: 380px;
            height: 480px;
            pointer-events: none;
            opacity: 0.35;
            z-index: 1;
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.15));
            animation: slowFloating 15s infinite ease-in-out;
        }

        .sparkle-bottom-right {
            position: absolute;
            bottom: 8%;
            right: 8%;
            width: 40px;
            height: 40px;
            pointer-events: none;
            opacity: 0.5;
            z-index: 1;
            filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.3));
        }

        /* Animations Keyframes */
        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.15;
            }

            50% {
                opacity: 0.85;
            }
        }

        @keyframes floatLogo {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        @keyframes slowFloating {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-15px) rotate(2deg);
            }

            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }

        /* Responsive Settings */
        @media (max-width: 1024px) {
            .fox-constellation {
                right: 2%;
                width: 280px;
                opacity: 0.2;
            }
        }

        @media (max-width: 768px) {
            .fox-constellation {
                display: none;
            }

            .sparkle-bottom-right {
                bottom: 4%;
                right: 4%;
            }
        }
    </style>
</head>

<body>

    <!-- Space Background Gradients -->
    <div class="cosmic-bg">
        <div class="nebula-glow-1"></div>
        <div class="nebula-glow-2"></div>

        <!-- Blinking stars background layer -->
        <svg class="celestial-star" style="top:15%; left:10%; animation-delay:0s;" width="8" height="8"
            viewBox="0 0 10 10">
            <circle cx="5" cy="5" r="2" />
        </svg>
        <svg class="celestial-star" style="top:40%; left:8%; animation-delay:1.5s;" width="12" height="12"
            viewBox="0 0 10 10">
            <circle cx="5" cy="5" r="1.5" />
        </svg>
        <svg class="celestial-star" style="top:80%; left:15%; animation-delay:3s;" width="6" height="6"
            viewBox="0 0 10 10">
            <circle cx="5" cy="5" r="2.5" />
        </svg>
        <svg class="celestial-star" style="top:70%; left:85%; animation-delay:0.5s;" width="10" height="10"
            viewBox="0 0 10 10">
            <circle cx="5" cy="5" r="2" />
        </svg>
        <svg class="celestial-star" style="top:25%; left:90%; animation-delay:2s;" width="8" height="8"
            viewBox="0 0 10 10">
            <circle cx="5" cy="5" r="1.5" />
        </svg>
        <svg class="celestial-star" style="top:90%; left:50%; animation-delay:1s;" width="12" height="12"
            viewBox="0 0 10 10">
            <circle cx="5" cy="5" r="2" />
        </svg>
    </div>

    <!-- Fox Constellation Graphic (on the right) -->
    <svg class="fox-constellation" viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Connecting lines -->
        <g stroke="#D4AF37" stroke-width="0.75" opacity="0.4" stroke-dasharray="3 3">
            <line x1="200" y1="80" x2="230" y2="40" />
            <line x1="230" y1="40" x2="250" y2="70" />
            <line x1="250" y1="70" x2="200" y2="80" />
            <line x1="200" y1="80" x2="170" y2="40" />
            <line x1="170" y1="40" x2="150" y2="70" />
            <line x1="150" y1="70" x2="200" y2="80" />

            <line x1="200" y1="80" x2="200" y2="130" />
            <line x1="200" y1="130" x2="260" y2="145" />
            <line x1="260" y1="145" x2="200" y2="170" />
            <line x1="200" y1="170" x2="140" y2="145" />
            <line x1="140" y1="145" x2="200" y2="130" />

            <line x1="140" y1="145" x2="110" y2="240" />
            <line x1="200" y1="170" x2="200" y2="250" />
            <line x1="260" y1="145" x2="290" y2="240" />

            <line x1="110" y1="240" x2="90" y2="340" />
            <line x1="290" y1="240" x2="310" y2="340" />

            <line x1="90" y1="340" x2="140" y2="410" />
            <line x1="310" y1="340" x2="260" y2="410" />
            <line x1="140" y1="410" x2="200" y2="250" />
            <line x1="260" y1="410" x2="200" y2="250" />

            <!-- Tail curves -->
            <line x1="140" y1="410" x2="80" y2="440" />
            <line x1="80" y1="440" x2="50" y2="340" />
            <line x1="50" y1="340" x2="100" y2="280" />

            <line x1="260" y1="410" x2="320" y2="440" />
            <line x1="320" y1="440" x2="350" y2="340" />
            <line x1="350" y1="340" x2="300" y2="280" />
        </g>

        <!-- Stars (nodes) -->
        <g fill="#D4AF37">
            <circle cx="200" cy="80" r="3" />
            <circle cx="230" cy="40" r="2.5" />
            <circle cx="250" cy="70" r="2.5" />
            <circle cx="170" cy="40" r="2.5" />
            <circle cx="150" cy="70" r="2.5" />

            <circle cx="200" cy="130" r="3" />
            <circle cx="260" cy="145" r="4" filter="url(#glow)" />
            <circle cx="200" cy="170" r="3" />
            <circle cx="140" cy="145" r="4" filter="url(#glow)" />

            <circle cx="110" cy="240" r="3" />
            <circle cx="200" cy="250" r="3" />
            <circle cx="290" cy="240" r="3" />

            <circle cx="90" cy="340" r="2.5" />
            <circle cx="310" cy="340" r="2.5" />

            <circle cx="140" cy="410" r="3" />
            <circle cx="260" cy="410" r="3" />

            <circle cx="80" cy="440" r="3" />
            <circle cx="50" cy="340" r="3" />
            <circle cx="100" cy="280" r="2" />

            <circle cx="320" cy="440" r="3" />
            <circle cx="350" cy="340" r="3" />
            <circle cx="300" cy="280" r="2" />
        </g>

        <defs>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>
    </svg>

    <!-- Star Sparkle Graphic (bottom right) -->
    <svg class="sparkle-bottom-right" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 30 0 Q 30 30 0 30 Q 30 30 30 60 Q 30 30 60 30 Q 30 30 30 0" fill="url(#goldGradient)" />
        <defs>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFF3C4" />
                <stop offset="50%" stop-color="#D4AF37" />
                <stop offset="100%" stop-color="#9E7815" />
            </linearGradient>
        </defs>
    </svg>

    <div class="login-container">

        <!-- Brand Logo Area -->
        <div class="brand-logo-area">
            <!-- Brand logo image -->
            <img th:src="@{/assets/logo.png}" class="logo-emblem" alt="ASTRAIL Logo" />
            <h1 class="logo-text">ASTRAIL</h1>
        </div>

        <!-- Glassmorphism Form Card -->
        <div class="glass-card">

            <!-- Absolute positioned wavy background tail curves for aesthetic -->
            <svg class="card-wave-tr" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M 0 8 Q 65 10 82 45 Q 95 70 92 100" stroke="#D4AF37" stroke-width="0.75" fill="none" />
                <path d="M 20 0 Q 75 10 88 35 Q 100 55 100 80" stroke="#D4AF37" stroke-width="0.5"
                    stroke-dasharray="2 2" fill="none" />
            </svg>
            <svg class="card-wave-bl" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M 100 92 Q 35 90 18 55 Q 5 30 8 0" stroke="#D4AF37" stroke-width="0.75" fill="none" />
                <path d="M 80 100 Q 25 90 12 65 Q 0 45 0 20" stroke="#D4AF37" stroke-width="0.5" stroke-dasharray="2 2"
                    fill="none" />
            </svg>

            <h2 class="welcome-title">Welcome back, Celestial Seeker</h2>

            <!-- Display login error message if URL has ?error -->
            <div class="alert alert-error" th:if="${param.error}">
                Invalid email address or password. Please try again.
            </div>

            <!-- Display logout message if URL has ?logout -->
            <div class="alert alert-success" th:if="${param.logout}">
                Successfully logged out from the Starry Sky.
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post">

                <div class="form-group">
                    <input id="username" name="username" class="input-field" placeholder="Email/Username"
                        required autofocus />
                </div>

                <div class="form-group">
                    <input type="password" id="password" name="password" class="input-field" placeholder="Password"
                        required />
                </div>

                <div class="options-row">
                    <label class="remember-checkbox">
                        <input type="checkbox" id="remember-me" name="remember-me" />
                        <span class="custom-checkbox"></span>
                        <span>Remember my journey</span>
                    </label>
                </div>

                <button type="submit" class="btn-submit">Enter the Starry Sky</button>

            </form>

            <div class="divider">or</div>

            <!-- Google Login Button -->
            <a href="/oauth2/authorization/google" class="btn-google">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                        fill="#EA4335" />
                </svg>
                <span>Sign in with Google</span>
            </a>

            <!-- Footer Links -->
            <div class="card-footer">
                <a href="/forgot-password" class="card-footer-link">Forgot password?</a>
                <span class="footer-separator"></span>
                <a href="/api/auth/register" class="card-footer-link">Create a new journey</a>
            </div>

        </div>

    </div>

</body>

</html>
