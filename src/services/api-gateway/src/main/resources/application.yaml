server:
  port: ${SERVER_PORT:8080}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Route to User Service (Resource Server) with Token Relay
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - TokenRelay=

        # Route to Identity Service
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://localhost:9000}
          predicates:
            - Path=/api/auth/**, /.well-known/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "${app.frontend-url}"
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
            allowed-methods:

              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true

  security:
    oauth2:
      client:
        registration:
          gateway:
            provider: astrail-auth-server
            client-id: my-client-gateway
            client-secret: secret
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - read
            client-name: Astrail API Gateway
        provider:
          astrail-auth-server:
            authorization-uri: ${AUTH_SERVER_AUTH_URI:http://localhost:9000/api/auth/authorize}
            token-uri: ${AUTH_SERVER_TOKEN_URI:http://localhost:9000/api/auth/token}
            jwk-set-uri: ${AUTH_SERVER_JWK_URI:http://localhost:9000/api/auth/jwks}
            user-info-uri: ${AUTH_SERVER_USERINFO_URI:http://localhost:9000/api/auth/userinfo}
            user-name-attribute: sub

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
